<!DOCTYPE html>
<html>
<head>
    <title>Button Event</title>
</head>
<body>

<button id="myBtn">Click Me</button>

<script>
    // Select button
    let button = document.getElementById("myBtn");

    // Add event listener
    button.addEventListener("click", function(){
        alert("Button clicked!");
    });
</script>

</body>
</html>
